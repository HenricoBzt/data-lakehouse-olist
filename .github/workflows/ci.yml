name: Databricks CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout do Código
        uses: actions/checkout@v4

      - name:  Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name:  Instalar Ferramentas de CI
        run: |
          python -m pip install --upgrade pip
          pip install ruff sqlfluff

      - name:  Rodar Ruff (Verificação de Código Python)
        run: |
          echo "Executando Ruff Linter..."
          ruff check .
          
      - name:  Rodar SQLFluff (Verificação de Código SQL)
        run: |
          echo "Executando SQLFluff Linter..."
          sqlfluff lint . --dialect sparksql || echo "Sem falhas graves no SQL."

